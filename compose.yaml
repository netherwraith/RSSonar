services:
  rssonar:
    build: .
    restart: unless-stopped
    ports:
      - "${RSSONAR_BIND:-0.0.0.0}:8765:8765"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8765}
      PUBLIC_FEED_URL: ${PUBLIC_FEED_URL:-}
      POLL_MINUTES: ${POLL_MINUTES:-15}
      SIGNAL_API_URL: ${SIGNAL_API_URL:-}
      SIGNAL_NUMBER: ${SIGNAL_NUMBER:-}
      SIGNAL_RECIPIENTS: ${SIGNAL_RECIPIENTS:-}
    volumes:
      - ./data:/app/data
